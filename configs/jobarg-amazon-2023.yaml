# One config file = one target environment.
# Per-entry checks/commands come from the presets file below.
presets: configs/shared/presets.yaml

environment:
  name: amazon-2023
  type: docker
  image: docker.io/zukidocker/solar:amzn2023

installers:
  - pattern: "bin/jobarranger-server*amzn2023*.rpm"
    use_preset: server-rpm

  - pattern: "bin/jobarranger-agentd*amzn2023*.rpm"
    use_preset: agentd-rpm

  - pattern: "bin/jobarranger-manager*amzn2023*.rpm"
    use_preset: manager-rpm

  - pattern: "bin/jobarranger-utils*amzn2023*.rpm"
