# One config file = one target environment.
# Per-entry checks/commands come from the presets file below.
presets: configs/shared/presets.yaml

environment:
  name: oracle-8
  type: docker
  image: docker.io/zukidocker/solar:oracle8

installers:
  - pattern: "bin/jobarranger-server*el8*.rpm"
    use_preset: server-rpm

  - pattern: "bin/jobarranger-agentd*el8*.rpm"
    use_preset: agentd-rpm

  - pattern: "bin/jobarranger-manager*el8*.rpm"
    use_preset: manager-rpm

  - pattern: "bin/jobarranger-utils*el8*.rpm"
