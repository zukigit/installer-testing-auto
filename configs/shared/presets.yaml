# Named presets, referenced from environment configs via use_preset.
# Not an environment config: kept under configs/shared/, which Discover
# never treats as environments (even with custom --config globs).
# Presets use the real paths only where they matter.
presets:
  server-rpm:
    install_checks:
      must_exist:
        - /usr/share/doc/jobarranger-server/database
    uninstall_checks:
      must_not_exist:
        - /usr/share/doc/jobarranger-server/database
        - /var/log/jobarranger
        - /etc/jobarranger/jobarg_server.conf
        - /var/lib/jobarranger/server
    upgrade_command: "echo new >> /etc/jobarranger/jobarg_server.conf && rpm -Uvh {installer}"
    upgrade_checks:
      must_exist:
        - /etc/jobarranger/jobarg_server.conf.rpmnew
  server-deb:
    install_checks:
      must_exist:
        - /usr/share/doc/jobarranger-server/database
    uninstall_command: "apt-get purge -y {package}"
    uninstall_checks:
      must_not_exist:
        - /usr/share/doc/jobarranger-server/database
        - /var/log/jobarranger
        - /etc/jobarranger/jobarg_server.conf
        - /var/lib/jobarranger/server
    upgrade_command: "echo new >> /etc/jobarranger/jobarg_server.conf && dpkg -i {installer}"
    upgrade_checks:
      must_exist:
        - /etc/jobarranger/jobarg_server.conf.new
  agentd-rpm:
    uninstall_checks:
      must_not_exist:
        - /var/log/jobarranger
        - /etc/jobarranger/jobarg_agentd.conf
        - /var/lib/jobarranger/agent
    upgrade_command: "echo new >> /etc/jobarranger/jobarg_agentd.conf && rpm -Uvh {installer}"
    upgrade_checks:
      must_exist:
        - /etc/jobarranger/jobarg_agentd.conf.rpmnew
  agentd-deb:
    uninstall_command: "apt-get purge -y {package}"
    uninstall_checks:
      must_not_exist:
        - /var/log/jobarranger
        - /etc/jobarranger/jobarg_agentd.conf
        - /var/lib/jobarranger/agent
    upgrade_command: "echo new >> /etc/jobarranger/jobarg_agentd.conf && dpkg -i {installer}"
    upgrade_checks:
      must_exist:
        - /etc/jobarranger/jobarg_agentd.conf.new
  manager-rpm:
    install_checks:
      must_exist:
        - /usr/share/jobarranger/modules/Module.php
        - /usr/lib/systemd/system/jam-cleanup.service
    uninstall_checks:
      must_not_exist:
        - /var/log/jobarranger
        - /usr/share/jobarranger
    upgrade_command: "echo new >> /etc/jobarranger/web/jam.config.php && rpm -Uvh {installer}"
    upgrade_checks:
      must_exist:
        - /etc/jobarranger/web/jam.config.php.rpmnew
  manager-deb:
    install_checks:
      must_exist:
        - /usr/share/jobarranger/modules/Module.php
        - /usr/lib/systemd/system/jam-cleanup.service
    uninstall_checks:
      must_not_exist:
        - /var/log/jobarranger
        - /usr/share/jobarranger
    upgrade_command: "echo new >> /etc/jobarranger/web/jam.config.php && dpkg -i {installer}"
    upgrade_checks:
      must_exist:
        - /etc/jobarranger/web/jam.config.php.new
