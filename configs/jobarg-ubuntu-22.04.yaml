# One config file = one target environment.
# Per-entry checks/commands come from the presets file below.
presets: configs/shared/presets.yaml

environment:
  name: ubuntu-22.0.4
  type: docker
  image: docker.io/zukidocker/solar:ubuntu22.04

installers:
  - pattern: "bin/jobarranger-server-{VERSION}*ubuntu22.04*.deb"
    use_preset: server-deb

  - pattern: "bin/jobarranger-agentd-{VERSION}*ubuntu22.04*.deb"
    use_preset: agentd-deb

  - pattern: "bin/jobarranger-manager-{VERSION}*ubuntu22.04*.deb"
    use_preset: manager-deb

  - pattern: "bin/jobarranger-utils-{VERSION}*ubuntu22.04*.deb"
    use_preset: utils
