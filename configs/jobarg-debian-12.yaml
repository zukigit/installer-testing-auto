# One config file = one target environment.
# Per-entry checks/commands come from the presets file below.
presets: configs/shared/presets.yaml

environment:
  name: debian-12
  type: docker
  image: docker.io/zukidocker/solar:debian12

installers:
  - pattern: "bin/jobarranger-server_{VERSION}*debian12*.deb"
    use_preset: server-deb

  - pattern: "bin/jobarranger-agentd_{VERSION}*debian12*.deb"
    use_preset: agentd-deb

  - pattern: "bin/jobarranger-manager_{VERSION}*debian12*.deb"
    use_preset: manager-deb

  - pattern: "bin/jobarranger-utils_{VERSION}*debian12*.deb"
    use_preset: utils
