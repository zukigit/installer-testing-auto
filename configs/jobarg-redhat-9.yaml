# One config file = one target environment.
# Per-entry checks/commands come from the presets file below.
presets: configs/shared/presets.yaml

environment:
  name: redhat-9
  type: docker
  image: docker.io/zukidocker/solar:rhel9

installers:
  - pattern: "bin/jobarranger-server*el9*.rpm"
    use_preset: server-rpm

  - pattern: "bin/jobarranger-agentd*el9*.rpm"
    use_preset: agentd-rpm

  - pattern: "bin/jobarranger-manager*el9*.rpm"
    use_preset: manager-rpm

  - pattern: "bin/jobarranger-utils*el9*.rpm"
