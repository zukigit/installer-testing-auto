# One config file = one target environment.
environment:
  name: ubuntu-24.0.4
  type: docker
  image: docker.io/zukidocker/solar:ubuntu24.04

installers:
  - pattern: "bin/jobarranger-server*ubuntu24.04*.deb"
    install_checks:
      must_exist: [
        "/usr/share/doc/jobarranger-server/database",
      ]
    uninstall_command: "apt-get purge -y {package}"
    uninstall_checks:
      must_not_exist: [
        "/usr/share/doc/jobarranger-server/database",
        "/var/log/jobarranger",
        "/etc/jobarranger/jobarg_server.conf",
        "/var/lib/jobarranger/server"
      ]
    upgrade_command: "echo new >> /etc/jobarranger/jobarg_server.conf && rpm -Uvh {installer}"
    upgrade_checks:
      must_exist:
        - /etc/jobarranger/jobarg_server.conf.new

  - pattern: "bin/jobarranger-agentd*ubuntu24.04*.deb"
    uninstall_command: "apt-get purge -y {package}"
    uninstall_checks:
      must_not_exist: [
        "/var/log/jobarranger",
        "/etc/jobarranger/jobarg_agentd.conf",
        "/var/lib/jobarranger/agent"
      ]
    upgrade_command: "echo new >> /etc/jobarranger/jobarg_agentd.conf && rpm -Uvh {installer}"
    upgrade_checks:
      must_exist:
        - /etc/jobarranger/jobarg_agentd.conf.new

  - pattern: "bin/jobarranger-manager*ubuntu24.04*.deb"
    install_checks:
      must_exist: [
        "/usr/share/jobarranger/modules/Module.php",
        "/usr/lib/systemd/system/jam-cleanup.service"
      ]
    uninstall_checks:
      must_not_exist: [
        "/var/log/jobarranger",
        "/usr/share/jobarranger"
      ]
    upgrade_command: "echo new >> /etc/jobarranger/web/jam.config.php && rpm -Uvh {installer}"
    upgrade_checks:
      must_exist:
        - /etc/jobarranger/web/jam.config.php.new

  - pattern: "bin/jobarranger-utils*ubuntu24.04*.deb"
