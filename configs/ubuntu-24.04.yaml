# One config file = one target environment.
environment:
  name: ubuntu-24.04
  type: docker
  image: ubuntu:24.04
  # workdir: /tmp            # optional, default /tmp

installers:
  # All files matched by the pattern form the package list; install and
  # uninstall both iterate over it. Commands use {installer}, {basename}
  # and {package} placeholders; defaults per extension (dpkg/rpm/...).
  - pattern: "bin/*.deb"
    # install_command:   "dpkg -i {installer}"
    # uninstall_command: "dpkg -r {package}"

    # All check fields are optional.
    install_checks:
      # must_exist: ["/usr/bin/myapp"]
      # must_not_exist: ["/tmp/legacy.conf"]
      commands:
        - command: "dpkg -s {package}"
    uninstall_checks:
      commands:
        - command: "dpkg -s {package}"
          expected_exit_code: 1
