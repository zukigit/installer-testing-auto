# One config file = one target environment.
# Per-entry checks/commands come from the presets file below.
presets: configs/shared/presets.yaml

environment:
  name: almalinux-9
  type: docker
  image: docker.io/zukidocker/solar:almalinux9

installers:
  - pattern: "bin/jobarranger-server-{VERSION}*el9*.rpm"
    use_preset: server-rpm

  - pattern: "bin/jobarranger-agentd-{VERSION}*el9*.rpm"
    use_preset: agentd-rpm

  - pattern: "bin/jobarranger-manager-{VERSION}*el9*.rpm"
    use_preset: manager-rpm

  - pattern: "bin/jobarranger-utils-{VERSION}*el9*.rpm"
    use_preset: utils
